<svg xmlns="http://www.w3.org/2000/svg" width="840" height="594" viewBox="0 0 840 594" role="img" aria-label="Sample Industry Internship Completion Certificate">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B4BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="840" height="594" fill="#FBFBFE"/>
  <rect x="24" y="24" width="792" height="546" fill="none" stroke="url(#g)" stroke-width="3" rx="8"/>
  <rect x="40" y="40" width="760" height="514" fill="none" stroke="#E5E7F0" stroke-width="1" rx="4"/>
  <text x="420" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5B4BFF" letter-spacing="3">AGENTIC QA TECHNOLOGIES LLP</text>
  <text x="420" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1A1A2E">Industry Internship Completion Certificate</text>
